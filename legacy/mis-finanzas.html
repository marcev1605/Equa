.brand{align-items:center}
.brand svg{height:46px;width:auto;display:block;color:var(--ink)}
.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.nav{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:23px;height:46px;min-width:64px;padding:0 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0}
.big{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1}
.mute{color:var(--mute);font-size:14px}
.trio{display:flex;gap:10px;margin:14px 0}
.trio button{text-align:left;cursor:pointer;color:inherit;font:inherit}
.trio div,.trio button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.trio b{display:block;font-size:18px}
.in{color:var(--in)}.out{color:var(--out)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
h2{font-size:15px;margin:0 0 8px;font-weight:600;color:var(--mute)}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.ck{width:26px;height:26px;border-radius:13px;border:2px solid var(--line);background:none;margin-right:10px;flex:none;cursor:pointer;color:#12343b;font-weight:800;line-height:1;padding:0}
.ck.on{background:var(--acc);border-color:var(--acc)}
.grow{flex:1;min-width:0}.it.done .grow{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:9;font-size:14px}
input[type=checkbox]{width:auto;margin:0 8px 0 0;vertical-align:middle}
.chk{display:block;margin-bottom:10px;font-size:14px}
.it small{color:var(--mute);display:block}
.del{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;padding:2px 8px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--acc)}
.lr{display:flex;justify-content:space-between;font-size:14px}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.cols span{display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center;height:90px}
.cols i{display:block;width:45%;border-radius:4px 4px 0 0;min-height:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:14px 2px;color:var(--mute);cursor:pointer;font-size:11px}
.tabs button.on{color:var(--ink);font-weight:800;box-shadow:inset 0 3px var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;border:0;background:var(--acc);color:#12343b;font-size:30px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
.sheet.open{display:flex}
.sheet form,.sheet .box{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.seg button.on{background:var(--acc);color:#12343b;font-weight:600;border-color:var(--acc)}
.row{display:flex;gap:8px}
.go{width:100%;background:var(--acc);color:#12343b;border:0;border-radius:10px;padding:13px;font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:6px 0}
 .sub{font-size:13px;color:var(--mute)}
.sheet .box{max-height:85vh;overflow-y:auto}
.wrow{display:block;width:100%;background:none;border:0;padding:0;margin-bottom:12px;text-align:left;cursor:pointer;color:inherit}
.ck:is(span){display:inline-flex;align-items:center;justify-content:center;cursor:default}
.opt{display:block;width:100%;padding:13px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left}.opt.bad{color:var(--out)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

  <input id="svDate" type="date">

</div>
<div class="sheet" id="ask"><div class="box"><p class="mute" id="askT"></p><input id="askIn" autocomplete="off"><button class="go" id="askOk">Guardar</button><button class="link" id="askNo">Cancelar</button></div></div>
<div class="sheet" id="act"><div class="box" id="actbox"></div></div>

<script>
const CE=['Comida','Transporte','Casa','Salud','Ocio','Compras','Otros'],CI=['Sueldo','Ventas','Bono','Inversiones','Electricidad','Extra','Otros'];
let S={tx:[]};
try{const r=localStorage.getItem('fin-v1');if(r)S=JSON.parse(r)}catch(e){}
const normCats=()=>{S.cats=S.cats||{};S.cats.sav=S.cats.sav||[];S.sav=S.sav||[];S.cats.in=S.cats.in||[];S.cats.out=S.cats.out||[];S.hid=S.hid||{};S.hid.in=S.hid.in||[];S.hid.out=S.hid.out||[];S.hid.sav=S.hid.sav||[];S.usd=+S.usd||0};normCats();
const SAVB=['USD','Inversiones','Acciones','Bonos','Otro'];
const savCats=()=>[...SAVB,...S.cats.sav].filter(c=>!S.hid.sav.includes(c));
const svBal=c=>S.sav.filter(x=>x.cat===c).reduce((a,x)=>a+x.amt,0);
function svAddCat(n){S.hid.sav=S.hid.sav.filter(x=>x!==n);if(![...SAVB,...S.cats.sav].includes(n))S.cats.sav.push(n);save()}
function svDelCat(c){if(S.cats.sav.includes(c))S.cats.sav=S.cats.sav.filter(x=>x!==c);else S.hid.sav.push(c);save()}
const svCatCard=()=>`<div class="card">${dHead('sav','Categorías de ahorro',savCats().length)}${savCats().map(c=>`<div class="it"><div class="grow">${esc(c)}<small>${fmt(svBal(c))}</small></div><button class="del" data-svdelcat="${encodeURIComponent(c)}" aria-label="Eliminar">×</button></div>`).join('')||'<p class="sub">No tienes categorías.</p>'}<button class="opt" id="svNewCat" style="margin-top:8px">＋ Agregar categoría</button>${S.hid.sav.length?`<h2 style="margin-top:12px">Eliminadas, toca para restaurar</h2>${S.hid.sav.map(c=>`<button class="opt" data-svres="${encodeURIComponent(c)}">↺ ${esc(c)}</button>`).join('')}`:''}<p class="sub">Solo se puede eliminar una categoría con saldo cero.</p></div></div>`;
const svMonth=x=>idxOf(new Date(x.date+'T00:00'));
const svNet=i=>S.sav.filter(x=>svMonth(x)===i).reduce((a,x)=>a+x.amt,0);
const svBefore=i=>S.sav.filter(x=>svMonth(x)<i).reduce((a,x)=>a+x.amt,0);
const svTo=i=>S.sav.filter(x=>svMonth(x)<=i).reduce((a,x)=>a+x.amt,0);
const catsOf=ty=>[...(ty==='out'?CE:CI),...S.cats[ty]].filter(c=>!S.hid[ty].includes(c));
function addCat(ty,n){S.hid[ty]=S.hid[ty].filter(x=>x!==n);if(![...(ty==='out'?CE:CI),...S.cats[ty]].includes(n))S.cats[ty].push(n);save()}
const normC=x=>String(x).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function catDup(ty,n){
  const vis=ty==='sav'?savCats():catsOf(ty),all=ty==='sav'?[...SAVB,...S.cats.sav]:[...(ty==='out'?CE:CI),...S.cats[ty]],k=normC(n);
  const v=vis.find(c=>normC(c)===k);if(v)return {name:v,hidden:false,msg:'Ya existe una categoría llamada "'+v+'"'};
  const h=all.find(c=>normC(c)===k);if(h)return {name:h,hidden:true,msg:'"'+h+'" ya existe entre las eliminadas: restaurala desde la lista'};
  return null;
}
function delCat(ty,c){if(S.cats[ty].includes(c))S.cats[ty]=S.cats[ty].filter(x=>x!==c);else S.hid[ty].push(c);save()}
S.cards=S.cards||[];S.start=S.start||0;S.paid=S.paid||{};S.cardInfo=S.cardInfo||{};S.pay=S.pay||[];
const normPay=()=>{if(S.payVer!==2){S.pay.forEach(p=>{p.i+=1});S.payVer=2}};normPay();
let _A=null,_sc={};
const P=o=>{if(o.t.card&&o.t.type==='out'){const q=stmt(cardOf(o.t),o.i);return q.due>0.005&&q.rem<0.005}return !!S.paid[o.t.id+':'+o.i]};
const save=()=>{_A=null;_sc={};try{localStorage.setItem('fin-v1',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(n).toLocaleString('es');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const idxOf=d=>d.getFullYear()*12+d.getMonth();
const label=(i,o)=>new Date(Math.floor(i/12),i%12,1).toLocaleDateString('es',o);
let cur=idxOf(new Date()),tab='res',type='out',pay='cash';
let askCb=null;
function ask(t,v,cb,ty,mn,mx){$('askIn').type=ty||'text';$('askIn').step='any';$('askIn').inputMode=ty==='number'?'decimal':'';$('askIn').min=mn||'';$('askIn').max=mx||'';$('askT').textContent=t;$('askIn').value=v==null?'':v;askCb=cb;$('ask').classList.add('open');$('askIn').focus()}
$('askOk').onclick=()=>{const v=$('askIn').value.trim();$('ask').classList.remove('open');if(v!=='')askCb(v)};
$('askNo').onclick=()=>$('ask').classList.remove('open');
function confirmDlg(msg,okLabel,bad,cb,noCb){
  const bx=$('actbox');bx.innerHTML='';
  const p=document.createElement('p');p.textContent=msg;bx.appendChild(p);
  const ok=document.createElement('button');ok.className='opt'+(bad?' bad':'');ok.textContent=okLabel;ok.onclick=()=>{$('act').classList.remove('open');cb()};bx.appendChild(ok);
  const no=document.createElement('button');no.className='link';no.textContent='Cancelar';no.onclick=()=>{$('act').classList.remove('open');if(noCb)noCb()};bx.appendChild(no);
  $('act').classList.add('open');
}
function pkToggle(key,after){
  const q=key.split(':'),o=all().find(x=>String(x.t.id)===q[0]&&String(x.i)===q[1]),on=!!S.paid[key],inc=o&&o.t.type==='in';
  const nm=o?'"'+(o.t.note||o.t.cat)+'" ('+fmt(o.a)+')':'este movimiento';
  const msg=on?'¿Desmarcar '+nm+'? Vuelve a quedar pendiente de '+(inc?'cobro':'pago')+' y '+(inc?'se descuenta de':'se suma a')+' tu disponible.':'¿Marcar '+nm+' como '+(inc?'cobrado':'pagado')+'? '+(inc?'Se suma a':'Se descuenta de')+' tu disponible.';
  confirmDlg(msg,on?'Desmarcar':(inc?'Marcar como cobrado':'Marcar como pagado'),false,()=>{S.paid[key]=!S.paid[key];save();render();if(after)after()},after);
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}


const hasClose=card=>{const ci=S.cardInfo[card]||{};return !!(ci.close||Object.keys(ci.months||{}).length)};
const closeDay=(card,i)=>{const ci=S.cardInfo[card]||{},c=(ci.months||{})[i]||ci.close;if(!c)return 31;return Math.min(c,new Date(Math.floor(i/12),i%12+1,0).getDate())};
const startIdx=t=>idxOf(new Date(t.date+'T00:00'))+(t.card&&t.fixed?1:0);
const occ=t=>{const d=new Date(t.date+'T00:00');let i0=idxOf(d);
 if(t.card&&!t.fixed&&d.getDate()>closeDay(t.cardName||'Tarjeta',i0))i0++;
 if(t.card)i0++;
 if(t.fixed)return Array.from({length:36},(_,k)=>i0+k).filter(i=>(t.end==null||i<=t.end)&&!(t.skip||[]).includes(i)).map(i=>({i,k:1,n:1,a:t.amt,t}));
 const n=t.card?(t.inst||1):1;return Array.from({length:n},(_,k)=>({i:i0+k,k:k+1,n,a:t.amt/n,t}))};
const all=()=>_A||(_A=S.tx.flatMap(occ));
const sum=(list,type)=>list.filter(o=>o.t.type===type).reduce((s,o)=>s+o.a,0);

let statOpen=[],statSav=false,dOpen={out:false,in:false,sav:false};
const dHead=(k,t,n)=>`<h2 data-dcat="${k}" role="button" aria-expanded="${dOpen[k]}" style="cursor:pointer;display:flex;justify-content:space-between;margin:0"><span>${dOpen[k]?'▾':'▸'} ${t}</span><span style="font-weight:400">${n}</span></h2><div style="display:${dOpen[k]?'block':'none'};margin-top:10px">`;
function svMonthCard(){
  const L=S.sav.filter(x=>!x.tid&&svMonth(x)===cur).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const dep=L.filter(x=>x.amt>0).reduce((a,x)=>a+x.amt,0),ret=L.filter(x=>x.amt<0).reduce((a,x)=>a-x.amt,0),net=dep-ret;
  const by={};L.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
  const det=!L.length?'<p class="mute" style="margin-top:8px">No hay movimientos de ahorro este mes.</p>':
    `<div style="margin-top:8px">${Object.entries(by).map(([c,v])=>`<div class="lr"><span>${esc(c)}</span><b class="${v<0?'out':'in'}">${v<0?'−':'+'}${fmt(Math.abs(v))}</b></div>`).join('')}</div><div style="margin:8px 0 0 0">${L.map(x=>`<div class="it"><div class="grow">${x.amt>0?'Depósito':'Retiro'} · ${esc(x.cat)}<small>${x.date.slice(8)}/${x.date.slice(5,7)}${x.note?' · '+esc(x.note):''}</small></div><div class="${x.amt>0?'in':'out'}">${x.amt>0?'+':'−'}${fmt(Math.abs(x.amt))}</div></div>`).join('')}</div>`;
  return `<div class="card"><div data-ssav="1" role="button" aria-expanded="${statSav}" style="cursor:pointer"><h2>Ahorro del mes</h2><div class="lr"><span>${statSav?'▾':'▸'} ${net<0?'Retiraste (neto)':'Ahorraste'}</span><b class="${net<0?'out':'in'}" style="font-size:22px">${net<0?'−':''}${fmt(Math.abs(net))}</b></div><div class="sub">Depósitos ${fmt(dep)} · Retiros ${fmt(ret)}</div></div>${statSav?det:''}</div>`;
}
function catBars(list){
  const by={},its={};list.filter(o=>o.t.type==='out').forEach(o=>{by[o.t.cat]=(by[o.t.cat]||0)+o.a;(its[o.t.cat]=its[o.t.cat]||[]).push(o)});
  const tot=Object.values(by).reduce((a,b)=>a+b,0);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  return rows.length?rows.map(([c,v])=>{const op=statOpen.includes(c);return `<div data-sc="${encodeURIComponent(c)}" role="button" aria-expanded="${op}" style="cursor:pointer"><div class="lr"><span>${op?'▾':'▸'} ${esc(c)} · ${Math.round(v/tot*100)}%</span><span>${fmt(v)}</span></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div>${op?`<div style="margin:6px 0 10px 14px">${its[c].sort((x,y)=>y.a-x.a).map(o=>`<div class="it"><div class="grow">${esc(o.t.note||o.t.cat)}<small>${o.t.date.slice(8)}/${o.t.date.slice(5,7)}${o.t.fixed?' · fijo':''}${o.t.card?' · tarjeta':''}${o.n>1?` · cuota ${o.k}/${o.n}`:''}</small></div><div class="out">${fmt(o.a)}</div></div>`).join('')}</div>`:''}`}).join(''):'<p class="mute">Todavía no hay gastos este mes.</p>';
}

function render(){
  $('mname').textContent=label(cur,{month:'long',year:'numeric'});
  $('mh').style.display=(tab==='res'||tab==='stat')?'flex':'none';
  const A=all(),M=A.filter(o=>o.i===cur),inc=sum(M,'in'),out=sum(M,'out')+advNet(cur);
  let h='';
  if(tab==='res'){
    const carry=(S.open||0)+sum(A.filter(o=>o.i<cur),'in')-sum(A.filter(o=>o.i<cur),'out')-svBefore(cur)-advCum(cur),avail=availFor(idxOf(new Date())),prev=carry+inc-out-svNet(cur);
    const cs=cardNames().map(n=>({n,...stmtN(n,cur)})).filter(q=>q.due+q.adv>0.005),nco=M.filter(o=>o.t.type==='out'&&!o.t.card),outTot=sum(nco,'out')+advIn(cur)+cs.reduce((a,q)=>a+q.due,0),outPend=sum(nco.filter(o=>!P(o)),'out')+cs.reduce((a,q)=>a+q.rem,0);
    const PM=S.pay.filter(p=>payEff(p)===cur),SV=S.sav.filter(x=>!x.tid&&svMonth(x)===cur);
    const odIn=sum(overdue('in'),'in'),odOut=sum(overdue('out'),'out'),OD=[...overdue('in'),...overdue('out')];
    h=`<div class="mute">Disponible ahora</div><div class="big ${avail<0?'out':''}">${fmt(avail)}</div>
    <div class="lr" style="margin-top:10px"><span>Previsto del mes</span><b class="${prev<0?'out':''}">${fmt(prev)}</b></div><div class="sub">Ingresos ${fmt(inc)} − gastos ${fmt(out)}${svNet(cur)?` ${svNet(cur)>0?'− ahorro':'+ retiro de ahorro'} ${fmt(Math.abs(svNet(cur)))}`:''} ${carry<0?'− deuda anterior':'+ saldo anterior'} ${fmt(Math.abs(carry))}</div>
    <div class="trio"><button data-all="in"><span class="mute">Ingresos ›</span><b class="in">${fmt(inc)}</b></button><button data-all="out"><span class="mute">Gastos ›</span><b class="out">${fmt(out)}</b></button></div>
    <div class="card"><h2>Pendiente del mes</h2>${[['in','Por cobrar','Cobrado',inc+odIn,sum(M.filter(o=>!P(o)),'in')+odIn,'var(--in)'],['out','Por pagar','Pagado',outTot+odOut,outPend+odOut,'var(--out)']].map(([ty,a,b,tot,pe,c])=>{const od=ty==='in'?odIn:odOut;return `<button class="wrow" data-pend="${ty}"><div class="lr"><span>${a} ›</span><b class="${ty}">${fmt(pe)}</b></div><div class="bar"><i style="width:${tot?(tot-pe)/tot*100:0}%;background:${c}"></i></div><div class="sub">${b} ${fmt(tot-pe)} de ${fmt(tot)}${od>0.005?' · incluye '+fmt(od)+' de meses anteriores':''}</div></button>`}).join('')}</div>
    <div class="card"><h2>Movimientos</h2>${(M.length||PM.length||OD.length||SV.length)?[...OD.map(o=>({d:'0',h:`<div class="it"><button class="ck" data-pk="${o.t.id}:${o.i}" aria-label="Marcar"></button><div class="grow">${esc(o.t.note||o.t.cat)}<small>${esc(o.t.cat)} · de ${label(o.i,{month:'long'})}${o.t.fixed?' · fijo':''}${repTxt(o.t)} · pendiente</small></div><div class="${o.t.type}">${o.t.type==='in'?'+':'−'}${fmt(o.a)}<button class="del" data-id="${o.t.id}" data-i="${o.i}" aria-label="Opciones">⋯</button></div></div>`})),...M.map(o=>({d:o.t.date,h:`<div class="it${P(o)?' done':''}">${o.t.card&&o.t.type==='out'?`<span class="ck${P(o)?' on':''}">${P(o)?'✓':''}</span>`:`<button class="ck${P(o)?' on':''}" data-pk="${o.t.id}:${o.i}" aria-label="Marcar pagado">${P(o)?'✓':''}</button>`}<div class="grow">${esc(o.t.note||o.t.cat)}<small>${o.t.cat} · ${o.t.date.slice(8)}/${o.t.date.slice(5,7)}${o.t.fixed?' · fijo':''}${repTxt(o.t)}${o.t.card?' · '+esc(o.t.cardName||'tarjeta')+(o.n>1?` ${o.k}/${o.n}`:''):''}${P(o)?'':' · pendiente'}</small></div><div class="${o.t.type}">${o.t.type==='in'?'+':'−'}${fmt(o.a)}<button class="del" data-id="${o.t.id}" data-i="${o.i}" aria-label="Opciones">⋯</button></div></div>`})),...SV.map(x=>({d:x.date,h:`<div class="it done"><span class="ck on">✓</span><div class="grow">${x.amt>0?'Depósito a Ahorro':'Retiro de Ahorro'} · ${esc(x.cat)}<small>Ahorro · ${x.date.slice(8)}/${x.date.slice(5,7)}${x.note?' · '+esc(x.note):''}</small></div><div>${x.amt>0?'−':'+'}${fmt(Math.abs(x.amt))}<button class="del" data-svopt="${x.id}" aria-label="Opciones">⋯</button></div></div>`})),...PM.map(p=>({d:p.date,h:`<div class="it done"><span class="ck on">✓</span><div class="grow">${isAdv(p)?'Adelanto de tarjeta':'Pago de tarjeta'} · ${esc(p.card)}<small>${isAdv(p)?'Resumen de '+label(p.i,{month:'long'})+' · adelantado el':'Resumen · pagado el'} ${p.date.slice(8)}/${p.date.slice(5,7)}</small></div><div class="out">−${fmt(p.amt)}<button class="del" data-undopay="${p.id}" aria-label="Opciones del pago">⋯</button></div></div>`}))].sort((a,b)=>b.d.localeCompare(a.d)).map(x=>x.h).join(''):'<p class="mute">Agrega tu primer movimiento con el botón +.</p>'}</div>`;
  }else if(tab==='fc'){
    const now=idxOf(new Date()),ms=Array.from({length:6},(_,k)=>now+k);
    const c0=(S.open||0)+sum(A.filter(o=>o.i<now),'in')-sum(A.filter(o=>o.i<now),'out')-svBefore(now)-advCum(now),av=availFor(now);
    let run=c0;
    const rows=ms.map(i=>{const m=A.filter(o=>o.i===i),a=sum(m,'in'),b=sum(m,'out')+advNet(i);run+=a-b-svNet(i);
      const cs={};m.filter(o=>o.t.card&&o.t.type==='out').forEach(o=>{const c=o.t.cardName||'Tarjeta';cs[c]=(cs[c]||0)+o.a});
      return `<div class="card"><div class="lr"><b>${label(i,{month:'long',year:'numeric'})}</b><b class="${run<0?'out':''}">${fmt(run)}</b></div><div class="sub">Previsto al cierre del mes</div><div class="lr"><span class="in">+ ${fmt(a)}</span><span class="out">− ${fmt(b)}</span></div>${svNet(i)?`<div class="sub">${svNet(i)>0?'Ahorro':'Retiro de ahorro'}: ${fmt(Math.abs(svNet(i)))}</div>`:''}${Object.entries(cs).map(([c,v])=>`<div class="sub">${esc(c)}: ${fmt(v)}</div>`).join('')}</div>`});
    h=`<div class="mute">Disponible hoy</div><div class="big ${av<0?'out':''}">${fmt(av)}</div><p class="sub">Lo cobrado menos lo pagado hasta hoy, más el saldo anterior. Cada mes parte del previsto del mes anterior.</p>${rows.join('')}`;
  }else if(tab==='card'){
    const now=idxOf(new Date());
    const names=[...new Set([...S.cards,...S.tx.filter(t=>t.card).map(t=>t.cardName||'Tarjeta')])];
    const tw=names.map(n=>{const cm=cardMonth[n]!=null?cardMonth[n]:now;return {n,m:cm+1,r:stmtD(n,cm+1).rem}}).filter(x=>x.r>0.005),twT=tw.reduce((x,y)=>x+y.r,0);
    const wid=names.length?`<div class="card"><h2>Tarjetas de crédito</h2>${tw.length?tw.map(x=>`<div class="lr"><span>${esc(x.n)} <small class="mute">· ${label(x.m,{month:'short'})}</small></span><b class="out">${fmt(x.r)}</b></div>`).join('')+`<div class="lr" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><b>Total a abonar</b><b class="out" style="font-size:20px">${fmt(twT)}</b></div>`:'<p class="mute">No tenés resúmenes pendientes ✓</p>'}</div>`:'';
    h=`<button class="go" id="addcard">Agregar tarjeta</button>`+wid+(names.length?names.map(n=>{
      const cm=cardMonth[n]!=null?cardMonth[n]:now,C=A.filter(o=>o.t.card&&cardOf(o.t)===n),Cm=C.filter(o=>o.i===cm+1),q=stmtD(n,cm+1),debt=Math.max(0,C.filter(o=>!o.t.fixed||o.i<=now+1).reduce((a,o)=>a+o.a,0)-S.pay.filter(p=>p.card===n).reduce((a,p)=>a+p.amt,0)),en=encodeURIComponent(n),has=q.due>0.005;
      const act=S.tx.filter(t=>t.card&&!t.fixed&&(t.inst||1)>1&&cardOf(t)===n&&occ(t).some(o=>o.i>=now));

  if(svDirV==='out'){const bal=others.filter(x=>x.cat===cat).reduce((s,x)=>s+x.amt,0);if(a>bal+0.005){toast('En '+cat+' solo tienes '+fmt(Math.max(0,bal)));return}}
  const keep=S.sav;S.sav=others;const av=availFor(idxOf(new Date(date+'T00:00')));S.sav=keep;
  const na2=svDirV==='in'?a:-a,nl=[...others,{cat,amt:na2,date}];
  const msg=old?'¿Guardar los cambios? Antes: '+mvDesc(old.amt,old.cat)+'. Ahora: '+mvDesc(na2,cat)+'. Tu cuenta disponible pasa de '+fmt(availWith(S.sav,date))+' a '+fmt(availWith(nl,date))+'. '+[...new Set([old.cat,cat])].map(c=>'Ahorro · '+c+': de '+fmt(balOf(S.sav,c))+' a '+fmt(balOf(nl,c))).join('; ')+'.':svDirV==='in'?'¿Mover '+fmt(a)+' de tu cuenta a Ahorro · '+cat+'? Disponible ahora: '+fmt(av)+'.'+(a>av?' Ojo: supera tu disponible.':''):'¿Retirar '+fmt(a)+' de Ahorro · '+cat+' y llevarlos a tu cuenta?';
  confirmDlg(msg,old?'Guardar cambios':svDirV==='in'?'Depositar':'Retirar',false,()=>{
    const it={id:old?old.id:Date.now(),cat,amt:svDirV==='in'?a:-a,date,note};
    if(old)S.sav[S.sav.indexOf(old)]=it;else S.sav.push(it);
    save();$('svSheet').classList.remove('open');render();toast(old?'Movimiento actualizado':'Movimiento registrado')});
};
function openSvAct(id){
  const x=S.sav.find(z=>z.id===id);if(!x)return;
  const bx=$('actbox');bx.innerHTML='';
  const p=document.createElement('p');p.className='mute';p.textContent=svLabel(x).replace(/&amp;/g,'&')+' · '+fmt(Math.abs(x.amt));bx.appendChild(p);
  const mk=(t,c,f)=>{const b=document.createElement('button');b.className=c;b.textContent=t;b.onclick=()=>{$('act').classList.remove('open');f()};bx.appendChild(b)};
  if(x.tid)mk('Borrar transferencia','opt bad',()=>{
    const rest=S.sav.filter(z=>z.tid!==x.tid);
    for(const z of S.sav.filter(z=>z.tid===x.tid))if(rest.filter(r=>r.cat===z.cat).reduce((t,r)=>t+r.amt,0)<-0.005){toast('No se puede borrar: dejaría '+z.cat+' en negativo');return}
    const lo=S.sav.find(z=>z.tid===x.tid&&z.amt<0),li=S.sav.find(z=>z.tid===x.tid&&z.amt>0);
    confirmDlg('¿Borrar esta transferencia de '+fmt(Math.abs(lo.amt))+' de '+lo.cat+' a '+li.cat+'? Los '+fmt(Math.abs(lo.amt))+' vuelven a Ahorro · '+lo.cat+' (pasa de '+fmt(balOf(S.sav,lo.cat))+' a '+fmt(balOf(rest,lo.cat))+') y salen de Ahorro · '+li.cat+' (pasa de '+fmt(balOf(S.sav,li.cat))+' a '+fmt(balOf(rest,li.cat))+'). Tu cuenta disponible no cambia.','Borrar',true,()=>{S.sav=rest;save();render();toast('Transferencia borrada')})});
  else{mk('Editar','opt',()=>openSv(null,x));
  mk('Borrar','opt bad',()=>{
    const rest=S.sav.filter(z=>z!==x),b2=rest.filter(z=>z.cat===x.cat).reduce((s,z)=>s+z.amt,0);
    if(b2<-0.005){toast('No se puede borrar: dejaría '+x.cat+' en negativo');return}
    const A0=availWith(S.sav,x.date),A1=availWith(rest,x.date),m=fmt(Math.abs(x.amt));
    confirmDlg(x.amt>0?'¿Borrar este depósito de '+m+' en Ahorro · '+x.cat+'? Los '+m+' salen de Ahorro · '+x.cat+' (queda en '+fmt(b2)+') y vuelven a tu cuenta disponible (pasa de '+fmt(A0)+' a '+fmt(A1)+').':'¿Borrar este retiro de '+m+' de Ahorro · '+x.cat+'? Los '+m+' dejan tu cuenta disponible (pasa de '+fmt(A0)+' a '+fmt(A1)+') y vuelven a Ahorro · '+x.cat+' (queda en '+fmt(b2)+').','Borrar',true,()=>{S.sav=rest;save();render();toast('Movimiento borrado')})});}
  mk('Cancelar','link',()=>{});
  $('act').classList.add('open');
}
render();
</script>
